@if (character.position$ | async; as pos) {
  @if (character.facing$ | async; as facing) {
    <div
      class="torti-container"
      [ngStyle]="getContainerStyle(pos)"
      (click)="onClick()"
      role="button"
      tabindex="0"
      aria-label="Torti the Explorer"
    >
      <div class="torti-shadow" [ngStyle]="getShadowStyle()" aria-hidden="true"></div>

      @for (layer of layers; track layer.id) {
        <img
          class="torti-sprite"
          [class.torti-sprite--visible]="layer.visible"
          [ngStyle]="getSpriteStyle(facing)"
          [src]="poseUrl(layer.pose)"
          alt=""
        />
      }

      @if (character.isTalking$ | async) {
        <div class="torti-talk-indicator"></div>
      }

      @if (showBubble && speechText) {
        <div class="torti-speech-bubble" [ngStyle]="getBubbleStyle(facing)">
          <p>{{ speechText }}</p>
        </div>
      }
    </div>
  }
}
