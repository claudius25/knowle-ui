<main class="home-page">
  <div class="hero-panel">
    <section class="character-area" aria-label="Personajul Gnosy">
      <div class="torti-home-stage">
        <app-torti
          [centered]="true"
          [fitToContainer]="true"
          initialPose="idle"
          [speechText]="tortiSpeech"
          [showBubble]="tortiShowBubble"
          (characterClick)="onTortiClick($event)"
        />
      </div>
    </section>

    <header class="home-header">
      <h1 #homeTitle>GNOSY</h1>
    </header>
  </div>

  <footer class="home-footer" aria-label="Incepe jocul">
    @if (selectedLanguage) {
      @if (showIntroButton) {
        <button class="intro-button" type="button" (click)="goToIntro()">{{ uiText.text('introButton') }}</button>
      } @else {
        <button class="duo-button duo-button--green start-button" type="button" (click)="startGame()">
          <span>{{ text('introStart') }}</span>
        </button>
      }
    } @else {
      <div class="language-buttons" role="group" aria-label="Selecteaza limba">
        <button
          class="duo-button duo-button--neutral language-button"
          type="button"
          [class.selected]="selectedLanguage === 'en'"
          (click)="selectLanguage('en')"
        >
          <img class="language-flag" src="assets/home/en.png" alt="English" />
          <span class="language-label">En</span>
        </button>
        <button
          class="duo-button duo-button--neutral language-button"
          type="button"
          [class.selected]="selectedLanguage === 'ro'"
          (click)="selectLanguage('ro')"
        >
          <img class="language-flag" src="assets/home/ro.png" alt="Română" />
          <span class="language-label">Ro</span>
        </button>
      </div>
    }

  </footer>

  <div class="tts-toast" [class.visible]="ttsToastVisible" role="status" aria-live="polite">
    TTS e gata
  </div>
</main>
