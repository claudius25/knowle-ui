<main class="home-page">
  <header class="home-header">
    <h1 #homeTitle [style.font-size.px]="titleFontSize || null">GNOSIS</h1>
  </header>

  <section class="character-area" aria-label="Personajul Knowleus">
    <div class="torti-home-stage">
      <app-torti
        [centered]="true"
        [fitToContainer]="true"
        initialPose="idle"
        [speechText]="tortiSpeech"
        [showBubble]="tortiShowBubble"
        (characterClick)="onTortiClick($event)"
      />
    </div>
  </section>

  <footer class="home-footer" aria-label="Incepe jocul">
    @if (selectedLanguage) {
      <button class="duo-button duo-button--green start-button" type="button" (click)="startGame()">
        <span>Sa incepem</span>
      </button>
    } @else {
      <div class="language-buttons" role="group" aria-label="Selecteaza limba">
        <button
          class="duo-button duo-button--neutral language-button"
          type="button"
          [class.selected]="selectedLanguage === 'en'"
          (click)="selectLanguage('en')"
        >
          EN
        </button>
        <button
          class="duo-button duo-button--neutral language-button"
          type="button"
          [class.selected]="selectedLanguage === 'ro'"
          (click)="selectLanguage('ro')"
        >
          RO
        </button>
      </div>
    }

  </footer>
</main>
