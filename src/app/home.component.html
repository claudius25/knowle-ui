<main class="home-page">
  <div class="decorations" aria-hidden="true">
    <span class="decoration decoration-bulb">✦</span>
    <span class="decoration decoration-globe">○</span>
    <span class="decoration decoration-books">▤</span>
    <span class="decoration decoration-star">✧</span>
    <span class="decoration decoration-doodle">⌁</span>
  </div>

  <header class="home-header">
    <h1 #homeTitle [style.font-size.px]="titleFontSize || null">KNOWLEUS</h1>
    <p>Mereu ai cate ceva de-nvatat</p>
  </header>

  <section class="character-area" aria-label="Personajul Knowleus">
    <div class="torti-home-stage">
      <app-torti [centered]="true" [fitToContainer]="true" initialAnimation="wave" />
    </div>
  </section>

  <footer class="home-footer" aria-label="Incepe jocul">
    @if (selectedLanguage) {
      <button class="start-button" type="button" (click)="startGame()">
        <span>Sa incepem</span>
        <span class="arrow" aria-hidden="true">→</span>
      </button>
    } @else {
      <div class="language-buttons" role="group" aria-label="Selecteaza limba">
        <button
          class="language-button"
          type="button"
          [class.selected]="selectedLanguage === 'en'"
          (click)="selectLanguage('en')"
        >
          EN
        </button>
        <button
          class="language-button"
          type="button"
          [class.selected]="selectedLanguage === 'ro'"
          (click)="selectLanguage('ro')"
        >
          RO
        </button>
      </div>
    }

    <div class="pagination" aria-hidden="true">
      <span class="pagination-dot active"></span>
      <span class="pagination-dot"></span>
      <span class="pagination-dot"></span>
    </div>
  </footer>
</main>
