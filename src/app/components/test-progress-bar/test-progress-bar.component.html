<header class="game-header">
  <button class="header-btn close-btn" aria-label="Close" (click)="onClose()">
    ✕
  </button>

  <div class="progress">
    <div class="progress__track">
      <div class="progress__fill" [style.width.%]="progress"></div>
    </div>
  </div>

  <app-health-display class="header-btn stat-btn battery-btn" [value]="health"></app-health-display>

  <app-coin-display class="header-btn stat-btn coin-btn" [amount]="coins"></app-coin-display>

</header>
