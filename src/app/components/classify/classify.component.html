<div class="question-block">
  <p class="question-label">{{ uiText.text('classify') }}</p>
  <h2>{{ data.question }}</h2>
</div>

<div class="classify-list">
  @for (item of data.items; track item.id) {
    <div class="classify-item">
      <strong>{{ item.label }}</strong>
      <div class="category-list" [attr.aria-label]="uiText.text('categoriesFor') + ' ' + item.label">
        @for (category of data.categories; track category.id) {
          <button
            mat-stroked-button
            class="category-button"
            type="button"
            [class.selected]="isSelected(item.id, category.id)"
            [disabled]="disabled"
            (click)="choose(item.id, category.id)"
          >
            {{ category.label }}
          </button>
        }
      </div>
    </div>
  }
</div>

<button mat-raised-button color="primary" class="check-button" type="button" [disabled]="disabled || !isComplete" (click)="submit()">
  {{ uiText.text('check') }}
</button>
