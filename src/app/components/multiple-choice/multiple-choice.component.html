<div class="question-block">
  <p class="question-label">{{ uiText.text('question') }}</p>
  <h2>{{ data.question }}</h2>
</div>

<div class="answers" [attr.aria-label]="uiText.text('answers')">
  @for (option of data.options; track option) {
    <button
      mat-stroked-button
      class="answer-card"
      type="button"
      [class.selected]="selectedAnswer === option"
      [disabled]="disabled"
      (click)="select(option)"
    >
      <span class="answer-marker" aria-hidden="true"></span>
      <span>{{ option }}</span>
    </button>
  }
</div>
