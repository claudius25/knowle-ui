<div class="question-block">
  <p class="question-label">{{ uiText.text('trueFalse') }}</p>
  <h2>{{ data.question }}</h2>
</div>

<div class="boolean-answers" [attr.aria-label]="uiText.text('trueFalse')">
  <button
    mat-stroked-button
    class="answer-card"
    type="button"
    [class.selected]="selectedAnswer === true"
    [disabled]="disabled"
    (click)="select(true)"
  >
    {{ uiText.text('trueLabel') }}
  </button>
  <button
    mat-stroked-button
    class="answer-card"
    type="button"
    [class.selected]="selectedAnswer === false"
    [disabled]="disabled"
    (click)="select(false)"
  >
    {{ uiText.text('falseLabel') }}
  </button>
</div>
