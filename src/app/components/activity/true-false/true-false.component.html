<div class="question-block">
  <div class="question-row">
    <div class="question-character">
      <app-torti
        [centered]="true"
        [fitToContainer]="true"
        [initialPose]="characterPose"
        [speechText]="characterSpeech"
        [showBubble]="!!characterSpeech"
      />
    </div>
    <div>
      <h2>{{ data.question }}</h2>
    </div>
  </div>
</div>

<div class="activity-image"></div>

<div class="boolean-answers" [attr.aria-label]="uiText.text('trueFalse')">
  <button
    class="duo-button duo-button--neutral answer-card"
    type="button"
    [class.selected]="selectedAnswer === true"
    [disabled]="disabled"
    (click)="select(true)"
  >
    {{ uiText.text('trueLabel') }}
  </button>
  <button
    class="duo-button duo-button--neutral answer-card"
    type="button"
    [class.selected]="selectedAnswer === false"
    [disabled]="disabled"
    (click)="select(false)"
  >
    {{ uiText.text('falseLabel') }}
  </button>
</div>
