<div class="question-block">
  @if (activity.data.title) {
    <h3 class="activity-title">{{ activity.data.title }}</h3>
  }
  @if (activity.data.description) {
    <div class="question-description-row">
      <p class="question-description">{{ activity.data.description }}</p>
    </div>
  }
  <div class="question-row">
    <h2>{{ activity.data.question }}</h2>
    <button
      class="speak-btn"
      type="button"
      [class.speaking]="isSpeaking$ | async"
      (click)="speak()"
      [attr.aria-label]="uiText.text('audioListen', 'Ascultă')"
      title="Ascultă întrebarea"
    >
      <mat-icon>record_voice_over</mat-icon>
    </button>
  </div>
</div>

<div class="matching-container" [attr.aria-label]="uiText.text('matching')">
  <!-- Left Column (Group 1) -->
  <div class="matching-column matching-column--left">
    @for (item of activity.leftItems; track item.id) {
      <button
        #leftCard
        class="duo-button duo-button--neutral match-card match-card-left"
        type="button"
        [style.background-color]="'white'"
        [class.selected]="activity.selectedLeftId === item.id"
        [class.matched]="activity.isMatched(item.id)"
        [class.mismatch]="isLeftWrong(item.id)"
        [style.background-image]="'url(' + item.image + ')'"
        [disabled]="activity.isLocked || activity.isMatched(item.id)"
        (click)="selectLeft(item.id)"
      >
        @if (item.image) {
          <img [src]="item.image" [alt]="item.text" class="card-image" (load)="handleImageLoad()" />
        }
        <span class="card-text">{{ item.text }}</span>
      </button>
    }
  </div>

  <!-- Right Column (Group 2) -->
  <div class="matching-column matching-column--right">
    @for (item of activity.rightItems; track item.id) {
      <button
        #rightCard
        class="duo-button duo-button--neutral match-card match-card-right"
        type="button"
        [class.selected]="activity.selectedRightId === item.id"
        [class.matched]="activity.isMatched(item.id)"
        [class.mismatch]="isRightWrong(item.id)"
        [disabled]="activity.isLocked || activity.isMatched(item.id)"
        (click)="selectRight(item.id)"
      >
        <span class="card-text">{{ item.text }}</span>
      </button>
    }
  </div>
</div>
