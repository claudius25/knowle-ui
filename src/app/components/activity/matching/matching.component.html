<div class="question-block">
  <div class="question-row">
    <h2>{{ data.question }}</h2>
  </div>
  <p class="instruction-label">{{ uiText.text('matchingInstruction') }}</p>
</div>

<div class="matching-container" [attr.aria-label]="uiText.text('matching')">
  <!-- Left Column (Group 1) -->
  <div class="matching-column matching-column--left">
    @for (item of leftItems; track item.id) {
      <button
        class="duo-button duo-button--neutral match-card"
        type="button"
        [class.selected]="isLeftSelected(item.id)"
        [class.matched]="isMatched(item.id)"
        [class.mismatch]="isLeftWrong(item.id)"
        [disabled]="disabled || isMatched(item.id)"
        (click)="selectLeft(item.id)"
      >
        <span class="card-text">{{ item.text }}</span>
        @if (isMatched(item.id)) {
          <span class="check-badge" aria-hidden="true">✓</span>
        }
      </button>
    }
  </div>

  <!-- Right Column (Group 2) -->
  <div class="matching-column matching-column--right">
    @for (item of rightItems; track item.id) {
      <button
        class="duo-button duo-button--neutral match-card"
        type="button"
        [class.selected]="isRightSelected(item.id)"
        [class.matched]="isMatched(item.id)"
        [class.mismatch]="isRightWrong(item.id)"
        [disabled]="disabled || isMatched(item.id)"
        (click)="selectRight(item.id)"
      >
        <span class="card-text">{{ item.text }}</span>
        @if (isMatched(item.id)) {
          <span class="check-badge" aria-hidden="true">✓</span>
        }
      </button>
    }
  </div>
</div>
