<div class="question-block">
  @if (activity.data.title) {
    <h3 class="activity-title">{{ activity.data.title }}</h3>
  }
  @if (activity.data.description) {
    <div class="question-description-row">
      <p class="question-description">{{ activity.data.description }}</p>
    </div>
  }
  <div class="question-row">
    <h3 [style.margin]="0">
      <span class="speak-btn" [class.speaking]="isSpeaking$ | async" (click)="speak()">📣</span>
      {{ activity.data.question }}
    </h3>
    <button class="settings-btn" matButton [matMenuTriggerFor]="menu">⋮</button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item [disabled]="!activity.canUseHint" (click)="chapter.showHint()">
        {{ uiText.text('hint') }}
      </button>
    </mat-menu>
  </div>
</div>

<div
  class="ordering-list"
  cdkDropList
  [cdkDropListData]="activity.items"
  [cdkDropListDisabled]="activity.isLocked"
  (cdkDropListDropped)="drop($event)"
  [attr.aria-label]="uiText.text('ordering')"
>
  @for (item of activity.items; track item.id; let i = $index) {
    <div
      #orderingCard
      class="duo-button duo-button--neutral ordering-card"
      [class.ordering-card-small]="activity.items.length > 4"
      cdkDrag
      [cdkDragDisabled]="activity.isLocked"
    >
      <!-- <span class="order-badge">{{ i + 1 }}</span> -->
      <span class="ordering-card__text">{{ item.text }}</span>
      <span class="drag-handle-indicator" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <circle cx="8.5" cy="6.5" r="1.5" />
          <circle cx="15.5" cy="6.5" r="1.5" />
          <circle cx="8.5" cy="12" r="1.5" />
          <circle cx="15.5" cy="12" r="1.5" />
          <circle cx="8.5" cy="17.5" r="1.5" />
          <circle cx="15.5" cy="17.5" r="1.5" />
        </svg>
      </span>
    </div>
  }
</div>
