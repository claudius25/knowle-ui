<div class="question-block">
  @if (data.description) {
    <div class="question-description-row">
      <p class="question-description">{{ data.description }}</p>
      
    </div>
  }
  <div class="question-row">
    <h2>{{ data.question }}
    <button
        class="speak-btn"
        type="button"
        [class.speaking]="isSpeaking$ | async"
        (click)="speak()"
        [attr.aria-label]="uiText.text('ttsTest', 'Ascultă')"
        title="Ascultă descrierea și întrebarea"
      >
        <mat-icon>record_voice_over</mat-icon>
      </button>
      </h2>

      
  </div>
</div>



@if (data.pictures && data.pictures.length > 0) {
  <div class="activity-image-gallery">
    @for (pic of data.pictures; track pic) {
      <div class="activity-image-wrapper">
        <img [src]="pic" alt="Activity illustration" class="activity-image" />
      </div>
    }
  </div>
}

<div class="answers" [class.answers--two-columns]="data.options.length === 4" [attr.aria-label]="uiText.text('answers')">
  @for (option of data.options; track option) {
    <button
      class="duo-button duo-button--neutral answer-card"
      type="button"
      [class.selected]="selectedAnswer === option"
      [disabled]="disabled"
      (click)="select(option)"
    >
      <span>{{ option }}</span>
    </button>
  }
</div>
