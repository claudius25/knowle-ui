<div class="question-block">
  @if (data.title) {
    <h3
      class="activity-title"
      [class.activity-title--on-light]="hasLightImage"
      [style.background-color]="imageBackgroundColor"
    >
      {{ data.title }}
    </h3>
  }
  @if (data.pictures && data.pictures.length > 0) {
    <div class="activity-image-gallery" [style.background-color]="imageBackgroundColor">
      @for (pic of data.pictures; track pic) {
        <div #activityImageWrapper class="activity-image-wrapper">
          <img
            [src]="pic"
            alt="Activity illustration"
            class="activity-image"
            (load)="handleImageLoad($event)"
          />
        </div>
      }
    </div>
  }

  @if (data.description) {
    <div class="question-description-row">
      <p
        #questionDescription
        class="question-description"
        [class.question-description--on-light]="hasLightImage"
        [style.background-color]="imageBackgroundColor"
      >
        {{ data.description }}
      </p>
    </div>
  }
  <div class="question-row">
    <h3 [style.margin]="0">
      <span class="speak-btn" [class.speaking]="isSpeaking$ | async" (click)="speak()">📣</span>
      {{ data.question }}
    </h3>
    <button class="settings-btn" matButton [matMenuTriggerFor]="menu">⋮</button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item>{{ uiText.text('fifty') }}</button>
      <button mat-menu-item>{{ uiText.text('hint') }}</button>
    </mat-menu>
  </div>
</div>

<div
  class="answers"
  [class.answers--two-columns]="data.options.length === 4"
  [attr.aria-label]="uiText.text('answers')"
>
  @for (option of data.options; track option) {
    <button
      class="duo-button duo-button--neutral answer-card"
      type="button"
      [class.selected]="selectedAnswer === option && answerState === null"
      [class.answer--correct]="selectedAnswer === option && answerState === 'correct'"
      [class.answer--incorrect]="selectedAnswer === option && answerState === 'incorrect'"
      [disabled]="disabled"
      (click)="select(option)"
    >
      <span>{{ option }}</span>
    </button>
  }
</div>
