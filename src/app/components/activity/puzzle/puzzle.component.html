<div class="question-block question-block--puzzle">

  @if (data.title) {
    <h3 class="activity-title">{{ data.title }}</h3>
  }

    <div
  class="puzzle-board"
  cdkDropListGroup
  [class.puzzle-board--solved]="isSolved"
  [style.grid-template-columns]="'repeat(' + gridSize + ', 1fr)'"
  [style.aspect-ratio]="boardAspectRatio"
  [style.width]="boardWidth"
  [attr.aria-label]="uiText.text('puzzle', 'Puzzle')"
>
  @for (piece of pieces; track $index; let position = $index) {
    <div
      class="puzzle-cell"
      cdkDropList
      [cdkDropListData]="position"
      [cdkDropListDisabled]="disabled || isSolved"
      (cdkDropListDropped)="drop($event)"
    >
      <div
        class="puzzle-piece"
        cdkDrag
        [cdkDragDisabled]="disabled || isSolved"
        [style.background-image]="'url(' + data.image + ')'"
        [style.background-size]="gridSize * 100 + '% ' + gridSize * 100 + '%'"
        [style.background-position]="pieceBackgroundPosition(piece)"
      ></div>
    </div>
  }
</div>

  @if (data.description) {
    <div class="question-description-row">
      <p class="question-description">{{ data.description }}</p>
      <button
        class="speak-btn"
        type="button"
        [class.speaking]="isSpeaking$ | async"
        (click)="speak()"
        [attr.aria-label]="uiText.text('audioListen', 'Ascultă')"
        title="Ascultă descrierea"
      >
        <mat-icon>record_voice_over</mat-icon>
      </button>
    </div>
  }
</div>



@if (isSolved) {
  <div class="puzzle-question">
    <div class="question-row">
      <h2>{{ data.question }}</h2>
    </div>

    <div
      class="answers"
      [class.answers--two-columns]="data.options.length % 2 === 0"
      [attr.aria-label]="uiText.text('answers')"
    >
      @for (option of data.options; track option) {
        <button
          class="duo-button duo-button--neutral answer-card"
          type="button"
          [class.selected]="selectedAnswer === option"
          [disabled]="disabled"
          (click)="select(option)"
        >
          <span>{{ option }}</span>
        </button>
      }
    </div>
  </div>
}
