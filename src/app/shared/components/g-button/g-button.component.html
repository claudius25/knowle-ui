<button
  class="duo-button g-button"
  type="button"
  [disabled]="disabled"
  [class.g-button--selected]="selected"
  [class]="colorsStyleClass"
  [style.--button-color]="colorsStyleClass ? null : defaultColor"
  [style.--button-depth]="colorsStyleClass ? null : depthColor"
  [style.--button-selected-color]="colorsStyleClass ? null : selectedColor"
  (mousedown)="handleMouseDown()"
  (click)="handleClick()"
>
  <span class="g-button__label">{{ uiText.text(labelKey) }}</span>
  <span class="g-button__content">
    <ng-content />
  </span>
</button>
