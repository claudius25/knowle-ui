<header class="hint-dialog__header">
  <h2 mat-dialog-title>
    <mat-icon aria-hidden="true">lightbulb</mat-icon>
    {{ uiText.text('hint') }}
  </h2>
  <button class="hint-dialog__close" type="button" aria-label="Close" (click)="close()">
    <mat-icon>close</mat-icon>
  </button>
</header>

<mat-dialog-content class="hint-dialog__content">
  <p>{{ data.hint }}</p>
</mat-dialog-content>
